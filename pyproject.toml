[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datasentry"
version = "0.1.0"
description = "Data quality checker for CSV files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "streamlit>=1.36.0",
  "plotly>=5.24.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
